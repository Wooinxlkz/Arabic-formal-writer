name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-register-check-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check (register_check.py)
        run: python3 -m py_compile skills/arabic-formal-writing/scripts/register_check.py

      - name: Validate plugin.json is well-formed JSON
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null

      - name: Validate marketplace.json is well-formed JSON
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Run test suite
        run: python3 tests/run_tests.py

      - name: Run word-list static validator
        run: python3 tests/validate_wordlists.py

      - name: CLI smoke test — good fixture (expect exit 0 with --strict)
        run: python3 skills/arabic-formal-writing/scripts/register_check.py tests/fixtures/good_letter.txt --doc-type letter --region maghreb --strict --json

      - name: CLI smoke test — flawed fixture (expect exit 1 with --strict)
        run: |
          if python3 skills/arabic-formal-writing/scripts/register_check.py tests/fixtures/flawed_letter.txt --doc-type letter --strict --json; then
            echo "Expected nonzero exit code on flawed fixture with --strict, got 0"
            exit 1
          else
            echo "Correctly exited nonzero on flawed fixture"
          fi

      - name: stdin mode smoke test
        run: echo "عايز اروح دابا" | python3 skills/arabic-formal-writing/scripts/register_check.py - --json
